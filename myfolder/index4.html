```html
<!DOCTYPE html>
<html>
<head>
    <title>Medicine Reminder</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf7f0;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 350px;
            margin: auto;
            border-radius: 12px;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            text-align: left;
            margin: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>💊 Medicine Reminder</h2>

    <input id="medicine" placeholder="Medicine Name">
    <input id="time" type="time">

    <button onclick="addMedicine()">Set Reminder</button>

    <h3>Medicine List</h3>
    <ul id="list"></ul>
</div>

<script>
function addMedicine() {
    let name = document.getElementById("medicine").value;
    let time = document.getElementById("time").value;

    if (name === "" || time === "") {
        alert("Enter medicine name and time!");
        return;
    }

    let medicine = { name: name, time: time };

    let medicines = JSON.parse(
        localStorage.getItem("medicines") || "[]"
    );

    medicines.push(medicine);

    localStorage.setItem("medicines", JSON.stringify(medicines));

    let li = document.createElement("li");
    li.textContent = name + " - " + time;
    document.getElementById("list").appendChild(li);

    let now = new Date();
    let reminder = new Date();
    let [hours, minutes] = time.split(":");

    reminder.setHours(Number(hours), Number(minutes), 0, 0);
    if (reminder <= now) {
        reminder.setDate(reminder.getDate() + 1);
    }
    let delay = reminder.getTime() - now.getTime();
    setTimeout(function() {
        alert("Time to take your medicine: " + name);
    }, delay);

    alert("Medicine reminder set!");

    document.getElementById("medicine").value = "";
    document.getElementById("time").value = "";
}
</script>

</body>
</html>
