
<!DOCTYPE html>
<html>
<head>
    <title>Implementing UI Elements</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            margin: 10px;
        }

        #message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Implementing UI Elements</h2>

        <input type="text" id="username"
               placeholder="Enter your name">

        <br>

        <button onclick="showMessage()">Submit</button>

        <button onclick="changeColor()">Change Color</button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            let name = document.getElementById("username").value;

            if (name === "") {
                alert("Please enter your name");
            } else {
                document.getElementById("message").innerHTML =
                    "Welcome, " + name + "!";
            }
        }

        function changeColor() {
            document.body.style.backgroundColor = "lightblue";
        }
    </script>

</body>
</html>
