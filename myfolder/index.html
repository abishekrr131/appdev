<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f0f7ff;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        textarea {
            width: 95%;
            height: 150px;
            padding: 10px;
            font-size: 18px;
            margin: 15px 0;
        }

        button {
            padding: 12px 22px;
            background: #1769ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Text to Speech</h1>

        <textarea id="text"
            placeholder="Enter your text here..."></textarea>

        <br>

        <button onclick="speakText()">Convert to Speech</button>
        <button onclick="speechSynthesis.cancel()">Stop</button>
    </div>

    <script>
        function speakText() {
            let text = document.getElementById("text").value;

            if (text.trim() === "") {
                alert("Please enter some text!");
                return;
            }

            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-US";
            speech.rate = 1;

            speechSynthesis.cancel();
            speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
